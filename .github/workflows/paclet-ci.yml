name: Paclet CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Classify and validate CI contract (unlicensed)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run_paclet: ${{ steps.classify.outputs.run_paclet }}
      run_wolfram: ${{ steps.classify.outputs.run_wolfram }}
      run_python_smoke: ${{ steps.classify.outputs.run_python_smoke }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release workflow contract
        run: python3 scripts/validate-release-contract.py

      - name: Check guarded Paclet publication action
        run: bash scripts/test-paclet-publication-action.sh

      - name: Check PowerShell retry policy
        shell: pwsh
        run: ./scripts/test-retry-python-tests.ps1

      - name: Check change classifier
        run: python3 scripts/test_ci_change_classifier.py

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 scripts/classify_ci_changes.py
          --event-name "${EVENT_NAME}"
          --base "${BASE_SHA}"
          --head "${HEAD_SHA}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Install pinned uv for compatibility checks
        if: >-
          steps.classify.outputs.run_paclet == 'true' ||
          steps.classify.outputs.run_wolfram == 'true' ||
          steps.classify.outputs.run_python_smoke == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: .python-version

      - name: Check structured-package compatibility compiler
        if: >-
          steps.classify.outputs.run_paclet == 'true' ||
          steps.classify.outputs.run_wolfram == 'true' ||
          steps.classify.outputs.run_python_smoke == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(tr -d '[:space:]' < .python-version)"
          uv run --no-project --managed-python --python "${python_version}" \
            python scripts/test_spf_compatibility.py

  python-smoke:
    name: Check locked Python environment (unlicensed)
    needs: contract
    if: needs.contract.outputs.run_python_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: 0.11.26
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync and probe locked dependencies
        run: |
          uv sync --locked
          uv run --no-sync python -c "import numpy, einops, einx, zmq"

  build:
    name: Run licensed Paclet and Wolfram validation
    needs: contract
    if: >-
      (needs.contract.outputs.run_paclet == 'true' ||
      needs.contract.outputs.run_wolfram == 'true') &&
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build archive
        uses: ./.github/actions/paclet-ci
        with:
          run_paclet: ${{ needs.contract.outputs.run_paclet }}
          run_wolfram: ${{ needs.contract.outputs.run_wolfram }}
        env:
          WOLFRAMSCRIPT_ENTITLEMENTID: ${{ secrets.WOLFRAMSCRIPT_ENTITLEMENTID }}
          WLPR_PACLET_SITE: https://resources.wolframcloud.com/PacletRepository/pacletsite

      - name: Upload archive
        if: needs.contract.outputs.run_paclet == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Einstoff-${{ github.sha }}
          path: |
            ./build/*.paclet
            ./build/spf-compatibility-manifest.json
          if-no-files-found: error
